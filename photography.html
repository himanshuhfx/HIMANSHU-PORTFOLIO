        <section class="photo-lightbox" aria-hidden="true">
          <div class="photo-lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="photo-lightbox-title">
            <div class="photo-lightbox-image-wrap">
              <img class="photo-lightbox-image" src="" alt="" />
            </div>
            <div class="photo-lightbox-copy">
              <div>
                <p class="eyebrow">Photography detail</p>
                <h2 id="photo-lightbox-title">Frame Study</h2>
                <p class="photo-lightbox-description"></p>
              </div>
              <div>
                <span class="photo-lightbox-meta">Shot on iPhone 15</span>
                <button class="photo-lightbox-close" type="button">Close view</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script>
      const photoLightbox = document.querySelector(".photo-lightbox");
      const photoLightboxImage = document.querySelector(".photo-lightbox-image");
      const photoLightboxTitle = document.querySelector("#photo-lightbox-title");
      const photoLightboxDescription = document.querySelector(".photo-lightbox-description");
      const photoLightboxClose = document.querySelector(".photo-lightbox-close");
      const photoDescriptions = [
        "A quiet frame built around natural light, negative space, and the small details that make an everyday scene feel cinematic.",
        "A study of texture and atmosphere, using soft contrast to turn a passing moment into a calm visual memory.",
        "A clean observational shot focused on balance, depth, and the gentle rhythm of real spaces.",
        "A candid frame shaped by available light, warm tones, and the feeling of being present in the moment.",
        "A minimal composition that lets the subject breathe, keeping the mood honest and visually restrained.",
        "A street-style capture where shadow, color, and movement come together like a still from a short film.",
        "A nature-led frame with a soft cinematic grade, photographed to preserve texture without over-polishing the scene.",
        "A simple visual pause, composed around light direction and the atmosphere of the place.",
        "A warm documentary-style photograph that finds personality in an ordinary corner of the day.",
        "A frame focused on natural geometry, subtle contrast, and a calm sense of space."
      ];

      document.querySelectorAll(".photo-entry").forEach((entry, index) => {
        const image = entry.querySelector(".photo-entry-image");
        entry.setAttribute("role", "button");
        entry.setAttribute("tabindex", "0");
        entry.setAttribute("aria-label", `Open ${image.alt}`);

        const openPhoto = () => {
          photoLightboxImage.src = image.src;
          photoLightboxImage.alt = image.alt;
          photoLightboxTitle.textContent = image.alt.replace("Photography frame", "Frame");
          photoLightboxDescription.textContent = photoDescriptions[index % photoDescriptions.length];
          photoLightbox.classList.add("is-open");
          photoLightbox.setAttribute("aria-hidden", "false");
          photoLightboxClose.focus();
        };

        entry.addEventListener("click", openPhoto);
        entry.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPhoto();
          }
        });
      });

      const closePhotoLightbox = () => {
        photoLightbox.classList.remove("is-open");
        photoLightbox.setAttribute("aria-hidden", "true");
        photoLightboxImage.src = "";
      };

      photoLightboxClose.addEventListener("click", closePhotoLightbox);
      photoLightbox.addEventListener("click", (event) => {
        if (event.target === photoLightbox) {
          closePhotoLightbox();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && photoLightbox.classList.contains("is-open")) {
          closePhotoLightbox();
        }
      });
    </script>
